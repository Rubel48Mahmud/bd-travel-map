<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>আমার ভ্রমণকৃত জেলা</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}body{font-family:"Noto Sans Bengali","Kalpurush",system-ui,sans-serif;background:#f1f5f9;color:#0f172a;min-height:100vh}
.wrap{max-width:480px;margin:0 auto;padding:8px;height:100dvh;display:flex;flex-direction:column}
.card{background:#fff;border-radius:16px;padding:10px;box-shadow:0 2px 10px #0001}
h1{font-size:20px;text-align:center;color:#15803d}
.hide{display:none!important}
#setup{text-align:center;padding:24px 14px}#main{display:flex;flex-direction:column;gap:8px;flex:1;min-height:0}.mp{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px}.hd{display:flex;align-items:center;gap:10px}.sm{width:auto!important;padding:6px 10px!important;font-size:15px!important}#srch{padding:5px 12px;font-size:13px;margin:0;border-radius:20px;border-width:1px}
#setup p{color:#475569;margin:8px 0 18px;font-size:14px}
.av{width:120px;height:120px;border-radius:50%;background:#e2e8f0 center/cover;margin:10px auto;border:4px solid #16a34a;display:flex;align-items:center;justify-content:center;font-size:40px;cursor:pointer;position:relative;overflow:hidden}.ed{position:absolute;bottom:0;left:0;right:0;background:#000a;color:#fff;font-size:13px;padding:3px 0;font-weight:600;text-align:center}
input[type=text]{width:100%;padding:12px;border:2px solid #e2e8f0;border-radius:12px;font:inherit;font-size:16px;margin:8px 0}
input:focus{outline:none;border-color:#16a34a}
button{font:inherit;border:0;border-radius:12px;padding:12px;background:#16a34a;color:#fff;font-weight:600;font-size:15px;cursor:pointer;width:100%}
button.g{background:#e2e8f0;color:#0f172a}
.row{display:flex;gap:8px;margin-top:8px}
.row button{flex:1;padding:11px 4px;font-size:13px}
.hd .av{width:44px;height:44px;margin:0;border-width:3px;font-size:18px;flex:none}.hd b{font-size:15px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hd small{display:block;color:#475569;font-size:12px}#pe{display:inline-block;margin-top:4px;padding:3px 10px;border-radius:12px;background:#dcfce7;color:#15803d;font-size:12px;font-weight:600;cursor:pointer}
.ac{position:relative}
.ul{text-align:left;position:absolute;left:0;right:0;top:100%;margin-top:-4px;background:#fff;border-radius:12px;box-shadow:0 8px 24px #0003;max-height:240px;overflow:auto;z-index:9;list-style:none}
.ul li{padding:11px 14px;border-bottom:1px solid #f1f5f9;font-size:15px}
.ul li:active{background:#dcfce7}
.ul li.no{color:#94a3b8}
#mb{flex:1;min-height:0;border-radius:12px}#map{width:100%;height:100%;display:block}.c path{stroke-width:.8;transition:fill .15s;cursor:pointer}.c text{font-size:6.6px;text-anchor:middle;dominant-baseline:middle;pointer-events:none}
.th{display:flex;gap:10px;margin:10px 0 2px;overflow-x:auto;padding:4px 2px}.th i{flex:none;width:38px;height:38px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #cbd5e1;cursor:pointer}.th i.s{box-shadow:0 0 0 3px #0f172a}
#pv{position:fixed;inset:0;background:#000b;z-index:30;display:flex;align-items:center;justify-content:center;padding:10px}.pb{background:#fff;border-radius:16px;padding:12px;width:100%;max-width:440px;max-height:96dvh;display:flex;flex-direction:column}#pi{flex:1;min-height:0;object-fit:contain;width:100%;border-radius:8px;background:#e2e8f0}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:20}
#toast.s{opacity:1}
</style>
</head>
<body>
<div class="wrap">

<div id="setup" class="card hide">
  <h1>🗺️ আমার ভ্রমণকৃত জেলা</h1>
  <p>শুরু করতে আপনার প্রোফাইল ছবি ও নাম দিন</p>
  <div class="av" id="sAv" onclick="file.click()"><span id="sIc">📷</span><b class="ed">Edit</b></div>
  <input type="file" id="file" accept="image/*" hidden>
  <input type="text" id="sName" placeholder="আপনার নাম" maxlength="40">
  <div class="ac"><input type="text" id="sHome" placeholder="🏠 আপনার নিজ জেলা (টাইপ করে খুঁজুন)" autocomplete="off"><ul id="ul2" class="ul hide"></ul></div>
  <button onclick="saveProfile()" style="margin-top:8px">শুরু করুন</button>
</div>

<div id="main" class="hide">
  <div class="card hd">
    <div class="av" id="mAv" onclick="editProfile()"></div>
    <div style="flex:1;min-width:0"><b id="mName"></b><small id="cnt"></small><a id="pe" onclick="editProfile()">✏️ Profile Edit</a></div>
    <button class="g sm" style="font-size:13px!important" onclick="resetAll()">Clear</button>
  </div>
  <div class="card mp">
    <div class="ac">
      <input type="text" id="srch" placeholder="🔍 জেলা খুঁজুন..." autocomplete="off">
      <ul id="ul" class="ul hide"></ul>
    </div>
    <div id="mb"><svg id="map"></svg></div>
    <button onclick="openPv()">📤 ফলাফল দেখুন · সেভ · শেয়ার</button>
  </div>
</div>
</div>
<div id="pv" class="hide"><div class="pb">
  <img id="pi" alt="preview">
  <div class="th" id="th"></div>
  <div class="row"><button onclick="dlImg()">⬇️ ছবি</button><button onclick="dlPdf()">📄 PDF</button><button onclick="share()">📤 শেয়ার</button></div>
  <button class="g" style="margin-top:8px" onclick="closePv()">✖ বন্ধ করুন</button>
</div></div>
<div id="toast"></div>

    $("sAv").style.backgroundImage=`url(${tmpPhoto})`;$("sIc").textContent="";
  };img.src=URL.createObjectURL(f);
};
function saveProfile(){
  const n=$("sName").value.trim(),h=$("sHome").value.trim();
  if(!tmpPhoto)return toast("প্রোফাইল ছবি দিন");
  if(!n)return toast("আপনার নাম লিখুন");
  if(!SORT.includes(h))return toast("তালিকা থেকে নিজ জেলা বাছাই করুন");
  S.name=n;S.home=h;S.photo=tmpPhoto;save();show();
}
function editProfile(){
  tmpPhoto=S.photo||"";$("sName").value=S.name||"";$("sHome").value=S.home||"";
  if(S.photo){$("sAv").style.backgroundImage=`url(${S.photo})`;$("sIc").textContent=""}
  $("main").classList.add("hide");$("setup").classList.remove("hide");
}
function show(){
  if(!S.name||!S.photo||!S.home){
    if(S.photo||S.name)editProfile();else{$("setup").classList.remove("hide");$("main").classList.add("hide")}
    return}
  $("setup").classList.add("hide");$("main").classList.remove("hide");
  $("mName").textContent=S.name;$("mAv").style.backgroundImage=`url(${S.photo})`;paint();
}
function resetAll(){if(confirm("সব নির্বাচিত জেলা মুছে ফেলবেন?")){S.v=[];save();paint()}}

// Export
function render(){return new Promise(res=>{
  const t=T(),W=1080,SC=2.4,OY=380,H=OY+Math.ceil(VB[1]*SC)+150,c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");
  const F='"Noto Sans Bengali","Kalpurush",sans-serif';
  const gr=x.createLinearGradient(0,0,W*.4,H);gr.addColorStop(0,t.bg[0]);gr.addColorStop(1,t.bg[1]);
  x.fillStyle=gr;x.fillRect(0,0,W,H);
  x.fillStyle=t.on;x.fillRect(0,0,W,14);
  const img=new Image();img.onload=()=>{
    x.save();x.beginPath();x.arc(150,150,90,0,7);x.closePath();x.clip();x.drawImage(img,60,60,180,180);x.restore();
    x.strokeStyle=t.on;x.lineWidth=8;x.beginPath();x.arc(150,150,94,0,7);x.stroke();
    x.textAlign="left";x.fillStyle=t.tx;x.font=`bold 54px ${F}`;x.fillText(S.name,270,115,570);
    x.font=`32px ${F}`;x.fillText("📍 নিজ জেলা: "+S.home,270,170,570);
    x.fillStyle=t.ac;x.font=`bold 36px ${F}`;x.fillText(`${bn(S.v.length)}/${bn(64)} জেলা ভ্রমণ করেছি`,270,228,570);
    x.fillStyle=t.on;x.beginPath();x.arc(955,150,80,0,7);x.fill();
    x.textAlign="center";x.textBaseline="middle";x.fillStyle=t.ot;x.font=`bold 52px ${F}`;x.fillText(bn(pc())+"%",955,138);
    x.font=`24px ${F}`;x.fillText("ভ্রমণকৃত",955,186);x.textBaseline="alphabetic";
    x.textAlign="center";x.fillStyle=t.tx;x.font=`bold 42px ${F}`;x.fillText("আমার ভ্রমণকৃত বাংলাদেশ 🇧🇩",W/2,325);
    const ox=(W-VB[0]*SC)/2;
    x.save();x.translate(ox,OY);x.scale(SC,SC);x.lineWidth=.8;x.strokeStyle=t.ln;x.lineJoin="round";
    DS.forEach(d=>{const p=new Path2D(d[1]);x.fillStyle=S.v.includes(d[0])?t.on:t.off;x.fill(p);x.stroke(p)});
    x.restore();
    x.textBaseline="middle";
    DS.forEach(d=>{const on=S.v.includes(d[0]);x.fillStyle=on?t.ot:t.tx;x.font=`${on?"bold ":""}15px ${F}`;x.fillText(d[0],ox+d[2]*SC,OY+d[3]*SC)});
    x.textBaseline="alphabetic";
    const ly=H-70;
    x.fillStyle=t.on;x.fillRect(250,ly,26,26);x.fillStyle=t.tx;x.textAlign="left";x.font=`28px ${F}`;x.fillText("ভ্রমণ করেছি",286,ly+24);
    x.fillStyle=t.off;x.fillRect(560,ly,26,26);x.fillStyle=t.tx;x.fillText("এখনো বাকি",596,ly+24);
    res(c);
  };img.src=S.photo;
})}
function save_(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
let cur=null;
async function refreshPv(){cur=await render();$("pi").src=cur.toDataURL("image/jpeg",.9)}
async function openPv(){$("pv").classList.remove("hide");await refreshPv()}
function closePv(){$("pv").classList.add("hide")}
function dlImg(){cur.toBlob(b=>save_(b,"amar-bhromon.png"))}
function dlPdf(){
  const c=cur,w=c.width,h=c.height;
  const jpg=Uint8Array.from(atob(c.toDataURL("image/jpeg",.92).split(",")[1]),ch=>ch.charCodeAt(0));
  const enc=new TextEncoder(),ch=[],o=[];let len=0;
  const add=v=>{const b=typeof v=="string"?enc.encode(v):v;ch.push(b);len+=b.length};
  const ob=(n,s)=>{o[n]=len;add(n+" 0 obj\n"+s)};
  const W=595,H=Math.round(595*h/w),cs=`q ${W} 0 0 ${H} 0 0 cm /I Do Q`;
  add("%PDF-1.4\n");
  ob(1,"<</Type/Catalog/Pages 2 0 R>>\nendobj\n");
  ob(2,"<</Type/Pages/Kids[3 0 R]/Count 1>>\nendobj\n");
  ob(3,`<</Type/Page/Parent 2 0 R/MediaBox[0 0 ${W} ${H}]/Contents 4 0 R/Resources<</XObject<</I 5 0 R>>>>>>\nendobj\n`);
  ob(4,`<</Length ${cs.length}>>\nstream\n${cs}\nendstream\nendobj\n`);
  ob(5,`<</Type/XObject/Subtype/Image/Width ${w}/Height ${h}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${jpg.length}>>\nstream\n`);
  add(jpg);add("\nendstream\nendobj\n");
  const xr=len;let s="xref\n0 6\n0000000000 65535 f \n";
  for(let i=1;i<6;i++)s+=String(o[i]).padStart(10,"0")+" 00000 n \n";
  add(s+`trailer\n<</Size 6/Root 1 0 R>>\nstartxref\n${xr}\n%%EOF`);
  save_(new Blob(ch,{type:"application/pdf"}),"amar-bhromon.pdf");
}
async function share(){
  const c=cur;
  c.toBlob(async b=>{
    const f=new File([b],"amar-bhromon.png",{type:"image/png"});
    const t=`আমি বাংলাদেশের ${bn(pc())}% (${bn(S.v.length)}/${bn(64)}) জেলা ভ্রমণ করেছি! আপনি কয়টি জেলা ঘুরেছেন?`;
    try{
      if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f],text:t,title:"আমার ভ্রমণকৃত জেলা"});
      else{save_(b,"amar-bhromon.png");toast("ছবি ডাউনলোড হয়েছে, এবার শেয়ার করুন")}
    }catch(e){}
  });
}
